<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Klar</title>
<meta name="description" content="Persönliche To-Do-App mit Sprachnotizen, Kalender und Erinnerungen.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klar">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<div class="topbar glass" id="topbar"><span id="topbarTitle">Heute</span></div>

<main id="view" class="view"></main>

<div class="dock">
  <nav class="tabbar glass" id="tabbar">
    <div class="tab-ind" id="tabInd"></div>
    <button class="tab" data-tab="today" aria-label="Heute">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/><circle cx="12" cy="15" r="1.8" class="fill"/></svg>
      <span>Heute</span></button>
    <button class="tab" data-tab="calendar" aria-label="Kalender">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="4"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M7.5 13h2M11 13h2M14.5 13h2M7.5 16.5h2M11 16.5h2"/></svg>
      <span>Kalender</span></button>
    <button class="tab" data-tab="all" aria-label="Alles">
      <svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.3" class="fill"/><circle cx="4.8" cy="12" r="1.3" class="fill"/><circle cx="4.8" cy="17.5" r="1.3" class="fill"/></svg>
      <span>Alles</span></button>
    <button class="tab" data-tab="lists" aria-label="Listen">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/></svg>
      <span>Listen</span></button>
  </nav>
  <button class="round glass mic-btn" id="micBtn" aria-label="Sprachnotiz aufnehmen">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
  </button>
  <button class="round glass add-btn" id="addBtn" aria-label="Neue Aufgabe">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="sheets"></div>
<div id="toasts" class="toasts"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
